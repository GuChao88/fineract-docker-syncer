name: Sync Docker images to ACR

# 触发：push 到 master 自动跑；也可在 GitHub 网页 Actions 标签点 "Run workflow" 手动触发。
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 诊断步骤：只报告长度/格式/连通性，绝不打印 secret 值（GitHub 会自动 mask 成 ***）
      - name: Validate secrets (diagnostics)
        env:
          REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }

          echo "== 1) secrets 长度（trim 前 -> 后；只报长度，不报内容） =="
          printf "  ALIYUN_REGISTRY : %s -> %s\n" "${#REGISTRY}" "$(trim "$REGISTRY" | wc -c)"
          printf "  ALIYUN_USERNAME : %s -> %s\n" "${#USERNAME}" "$(trim "$USERNAME" | wc -c)"
          printf "  ALIYUN_PASSWORD : %s -> %s\n" "${#PASSWORD}" "$(trim "$PASSWORD" | wc -c)"
          echo "  (前后不一致 = 粘贴时带入了首尾空格/换行，下面的 login 会自动去掉)"

          REGISTRY=$(trim "$REGISTRY")
          echo "== 2) REGISTRY 格式校验（应是裸域名） =="
          bad=0
          case "$REGISTRY" in
            http://*|https://*) echo "  ERROR: 带了 http(s):// 协议头"; bad=1 ;;
          esac
          case "$REGISTRY" in
            */*) echo "  ERROR: 带了路径/斜杠"; bad=1 ;;
          esac
          [ "$bad" = "0" ] && echo "  OK: 裸域名"

          echo "== 3) 连通性探测 =="
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$REGISTRY/v2/")
          echo "  GET https://<registry>/v2/ -> HTTP $code  (401 属正常：地址可达、要求鉴权)"

      # 手动 login，先 trim 掉 secret 里可能夹带的首尾空白
      - name: Login to Aliyun ACR
        env:
          REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -e
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          REGISTRY=$(trim "$REGISTRY")
          USERNAME=$(trim "$USERNAME")
          PASSWORD=$(trim "$PASSWORD")
          printf '%s' "$PASSWORD" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin

      - name: Pull, retag and push to ACR
        env:
          REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        run: |
          set -e
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          REGISTRY=$(trim "$REGISTRY")

          # 1) 后端 JDK25 基础镜像（部署 Dockerfile 的 FROM 指向它来构建 fineract-backend）
          docker pull azul/zulu-openjdk-alpine:25-jre-headless
          docker tag  azul/zulu-openjdk-alpine:25-jre-headless "$REGISTRY/fineract/backend:25-jre-headless"
          docker push "$REGISTRY/fineract/backend:25-jre-headless"

          # 2) 前端 nginx 镜像（compose 的 web 服务直接用它作运行时）
          docker pull nginx:1.31-alpine
          docker tag  nginx:1.31-alpine "$REGISTRY/fineract/nginx:1.31-alpine"
          docker push "$REGISTRY/fineract/nginx:1.31-alpine"

          echo "=== sync done ==="

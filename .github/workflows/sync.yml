name: Sync Docker images to ACR

# 触发：push 到 master 自动跑；也可在 GitHub 网页 Actions 标签点 "Run workflow" 手动触发。
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 诊断步骤：只报告格式/连通性，绝不打印 secret 值（GitHub 会自动 mask 成 ***）
      - name: Validate secrets (diagnostics)
        env:
          REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          echo "== 1) secrets 是否已配置（只报长度，不报内容） =="
          [ -n "$REGISTRY" ] && echo "  ALIYUN_REGISTRY : set, length=${#REGISTRY}" || echo "  ALIYUN_REGISTRY : EMPTY"
          [ -n "$USERNAME" ] && echo "  ALIYUN_USERNAME : set, length=${#USERNAME}" || echo "  ALIYUN_USERNAME : EMPTY"
          [ -n "$PASSWORD" ] && echo "  ALIYUN_PASSWORD : set, length=${#PASSWORD}" || echo "  ALIYUN_PASSWORD : EMPTY"

          echo "== 2) REGISTRY 格式校验（应是裸域名，如 registry.cn-hangzhou.aliyuncs.com） =="
          bad=0
          case "$REGISTRY" in
            http://*|https://*) echo "  ERROR: 带了 http(s):// 协议头，请去掉"; bad=1 ;;
          esac
          case "$REGISTRY" in
            */*) echo "  ERROR: 带了路径/斜杠（如 /fineract），请去掉"; bad=1 ;;
          esac
          [ "$bad" = "0" ] && echo "  OK: 格式看起来是裸域名"

          echo "== 3) 连通性探测 =="
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$REGISTRY/v2/" || echo "000")
          echo "  GET https://<registry>/v2/ -> HTTP $code"
          echo "  (401 = 地址可达且要求鉴权，属正常；000 = 地址不通/格式错)"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull, retag and push to ACR
        env:
          REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        run: |
          set -e

          # 1) 后端 JDK25 基础镜像（部署 Dockerfile 的 FROM 指向它来构建 fineract-backend）
          docker pull azul/zulu-openjdk-alpine:25-jre-headless
          docker tag  azul/zulu-openjdk-alpine:25-jre-headless "$REGISTRY/fineract/backend:25-jre-headless"
          docker push "$REGISTRY/fineract/backend:25-jre-headless"

          # 2) 前端 nginx 镜像（compose 的 web 服务直接用它作运行时）
          docker pull nginx:1.31-alpine
          docker tag  nginx:1.31-alpine "$REGISTRY/fineract/nginx:1.31-alpine"
          docker push "$REGISTRY/fineract/nginx:1.31-alpine"

          echo "=== sync done ==="
